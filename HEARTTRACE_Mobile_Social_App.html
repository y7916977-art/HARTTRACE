<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>《心動留痕》HEARTTRACE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#FDFBF7',
                            100: '#F8F5EE',
                            200: '#F0EAE1',
                        },
                        dusty: {
                            light: '#E5D9D0',
                            DEFAULT: '#D8C4B6',
                            mid: '#C4A493',
                            dark: '#A68A80',
                            deep: '#5C4E43'
                        },
                        darktitle: '#2C2825',
                        accent: '#C86D7C',
                        accenthover: '#B35B69'
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #121212;
            font-family: 'Noto Sans TC', sans-serif;
            color: #2C2825;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* App container adapting to full screen or centered mobile mockup */
        .app-viewport {
            width: 100%;
            height: 100%;
            max-width: 440px;
            background-color: #F8F5EE;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        /* Fully stretched view when in full-screen mode or small devices */
        body.is-fullscreen .app-viewport,
        @media (max-width: 480px) {
            .app-viewport {
                max-width: 100% !important;
                height: 100% !important;
                border-radius: 0 !important;
                border: none !important;
            }
        }

        @media (min-width: 481px) and (min-height: 700px) {
            body:not(.is-fullscreen) .app-viewport {
                height: 92vh;
                max-height: 880px;
                border-radius: 36px;
                border: 6px solid #2C2825;
            }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-header {
            background: rgba(253, 251, 247, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .avatar-box {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background-color: #F0EAE1;
            border-radius: 9999px;
            overflow: hidden;
            flex-shrink: 0;
        }

        @keyframes heartPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        .animate-heart { animation: heartPulse 0.3s ease-in-out; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hearttrace-rp-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoConfigForTestingOnly123456",
            authDomain: "demo.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:demo"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) {
            console.warn("Firebase initialization notice:", e);
        }

        window.HT_FIREBASE = {
            app, auth, db, appId,
            async initAuth() {
                if (!auth) return null;
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        return await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        return await signInAnonymously(auth);
                    }
                } catch(err) {
                    console.warn("Auth mode fallback:", err);
                    return null;
                }
            },
            getPublicCollection(collName) {
                if (!db) return null;
                return collection(db, 'artifacts', appId, 'public', 'data', collName);
            },
            getPublicDoc(collName, docId) {
                if (!db) return null;
                return doc(db, 'artifacts', appId, 'public', 'data', collName, docId);
            }
        };
    </script>
</head>
<body>

    <!-- Main Mobile Application Container -->
    <div id="app-container" class="app-viewport text-darktitle">

        <div id="role-setup-overlay" class="absolute inset-0 z-50 bg-cream-100 p-6 flex flex-col justify-between overflow-y-auto no-scrollbar">
            <div class="space-y-5 pt-2">
                <div class="text-center space-y-1">
                    <span class="font-serif italic text-3xl font-bold tracking-wider text-darktitle block">HEARTTRACE</span>
                    <p class="text-xs text-dusty-dark font-medium">《心動留痕》戀綜社群 ‧ RP 免登入專區</p>
                </div>

                <div class="bg-white rounded-3xl p-5 border border-dusty-light shadow-sm space-y-4">
                    <div class="flex items-center justify-between border-b border-dusty-light pb-2">
                        <h3 class="font-bold text-xs text-darktitle flex items-center space-x-1.5">
                            <i class="fa-solid fa-user-plus text-accent"></i>
                            <span>登場嘉賓登記 (完全免登入)</span>
                        </h3>
                        <span class="text-[9px] bg-cream-200 text-dusty-deep px-2 py-0.5 rounded-full font-bold">極速創建</span>
                    </div>

                    <div>
                        <label class="text-[11px] font-semibold text-dusty-dark block mb-1">嘉賓暱稱 (RP角名) *</label>
                        <input id="role-name" type="text" placeholder="輸入名字，例如：沈安寧" class="w-full p-2.5 border border-dusty-light rounded-xl text-xs bg-cream-50 focus:outline-none focus:bg-white">
                    </div>

                    <div>
                        <label class="text-[11px] font-semibold text-dusty-dark block mb-1">使用者 ID (@ID) *</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-xs text-dusty-dark font-bold">@</span>
                            <input id="role-handle" type="text" placeholder="an_ning" class="w-full pl-7 pr-3 py-2.5 border border-dusty-light rounded-xl text-xs bg-cream-50 focus:outline-none focus:bg-white">
                        </div>
                    </div>

                    <!-- Emoji or Image Avatar Picker -->
                    <div>
                        <label class="text-[11px] font-semibold text-dusty-dark block mb-1">選擇角色 Emoji 或自訂網址頭像</label>
                        <div class="grid grid-cols-6 gap-2 mb-2" id="emoji-avatar-grid">
                            <!-- Emojis populated by JS -->
                        </div>
                        <input id="role-avatar-custom" type="url" placeholder="或貼上自訂圖片網址 (https://...)" class="w-full p-2 border border-dusty-light rounded-xl text-[11px] bg-cream-50 focus:outline-none">
                    </div>

                    <div>
                        <label class="text-[11px] font-semibold text-dusty-dark block mb-1">入住宣言 / 角色簡介</label>
                        <textarea id="role-bio" placeholder="「浪漫不在別處，就在彼此的眼眸裡。」" class="w-full p-2.5 border border-dusty-light rounded-xl text-xs bg-cream-50 focus:outline-none focus:bg-white h-16 resize-none"></textarea>
                    </div>

                    <button onclick="submitRoleCreation()" class="w-full py-3 bg-darktitle text-cream-100 font-semibold rounded-2xl text-xs shadow-md hover:bg-black transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-sparkles text-accent"></i>
                        <span>加入小屋 ‧ 開始互動</span>
                    </button>
                </div>

                <!-- Existing local device roles -->
                <div id="device-roles-section" class="space-y-2 hidden">
                    <span class="text-[11px] font-bold text-dusty-dark uppercase tracking-wider block">切換此裝置的角色身份</span>
                    <div id="device-roles-list" class="space-y-2"></div>
                </div>
            </div>

            <p class="text-[10px] text-center text-dusty-dark py-3">零個人資料收集 ‧ 點開連結隨時與同好連線 RP</p>
        </div>

        <header class="glass-header sticky top-0 z-30 px-4 py-3 flex items-center justify-between border-b border-dusty-light/60">
            <div class="flex items-center space-x-2">
                <span class="font-serif italic text-2xl font-bold tracking-wider text-darktitle">HEARTTRACE</span>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Fullscreen Toggle Button -->
                <button onclick="toggleFullScreen()" title="全螢幕模式" class="w-8 h-8 rounded-full bg-cream-200/80 hover:bg-dusty-light text-darktitle flex items-center justify-center text-xs border border-dusty/40 transition">
                    <i id="fullscreen-icon" class="fa-solid fa-expand"></i>
                </button>

                <!-- Current Character Switcher -->
                <button onclick="openRoleSwitchModal()" class="flex items-center space-x-1.5 bg-cream-200/80 hover:bg-dusty-light transition px-2.5 py-1.5 rounded-full border border-dusty/40">
                    <div id="header-user-avatar" class="w-5 h-5 rounded-full avatar-box text-xs">👤</div>
                    <span id="header-user-name" class="text-xs font-semibold max-w-[70px] truncate">未選擇</span>
                    <i class="fa-solid fa-arrows-rotate text-[10px] text-dusty-dark"></i>
                </button>
            </div>
        </header>

        <main id="app-viewport" class="flex-1 overflow-y-auto no-scrollbar relative bg-cream-100 pb-20">

            <!-- VIEW 1: FEED -->
            <section id="view-feed" class="view-section space-y-4 p-3">
                <div class="flex space-x-3 overflow-x-auto no-scrollbar py-2 px-1 items-center">
                    <div onclick="openCreatePostModal()" class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                        <div class="w-13 h-13 w-[52px] h-[52px] rounded-full border-2 border-dashed border-dusty-mid flex items-center justify-center bg-white shadow-sm hover:bg-cream-50">
                            <i class="fa-solid fa-plus text-dusty-dark"></i>
                        </div>
                        <span class="text-[10px] mt-1 font-medium text-dusty-deep">發動態</span>
                    </div>
                    <div id="story-guests-container" class="flex space-x-3"></div>
                </div>

                <div id="posts-container" class="space-y-4"></div>
            </section>

            <!-- VIEW 2: ANONYMOUS QA -->
            <section id="view-qa" class="view-section hidden p-4 space-y-4">
                <div class="bg-gradient-to-br from-dusty-light/40 to-cream-200 p-4 rounded-3xl border border-dusty/30 shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-accent/15 flex items-center justify-center text-accent text-lg">
                            <i class="fa-solid fa-mask"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-sm text-darktitle">匿名提問箱</h3>
                            <p class="text-xs text-dusty-dark">給曖昧關係一點合理的混亂。</p>
                        </div>
                    </div>
                    <button onclick="openAskModal()" class="w-full mt-3 py-2.5 bg-darktitle text-cream-100 font-medium rounded-2xl text-xs shadow hover:bg-black transition flex items-center justify-center space-x-2">

                        <span>指定嘉賓進行匿名提問</span>
                    </button>
                </div>

                <div class="space-y-3">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-dusty-dark">匿名問答動態</h4>
                    <div id="questions-list" class="space-y-3"></div>
                </div>
            </section>

            <!-- VIEW 3: HEART VOTE -->
            <section id="view-heart" class="view-section hidden p-4 space-y-5">
                <div class="bg-white p-5 rounded-3xl border border-accent/20 shadow-sm space-y-4 text-center relative overflow-hidden">
                    <div class="inline-flex p-3 rounded-full bg-accent/10 text-accent mb-1">
                        <i class="fa-solid fa-heart-pulse text-2xl animate-pulse"></i>
                    </div>

                    <div>
                        <h3 class="font-serif italic font-bold text-xl text-darktitle">每日心動選擇</h3>
                        <p class="text-xs text-dusty-dark mt-1">私人投票結果加密保護，不會洩漏給任何人。</p>
                    </div>

                    <div id="vote-targets-grid" class="grid grid-cols-3 gap-3 pt-2"></div>

                    <button id="submit-vote-btn" onclick="submitHeartVote()" class="w-full py-3 bg-accent text-white font-semibold rounded-2xl text-xs shadow-md hover:bg-accenthover transition">
                        秘密投出心動一票
                    </button>
                    <p id="vote-status-msg" class="text-[11px] text-dusty-dark italic hidden">✓ 今日心動訊號已寄出</p>
                </div>
            </section>

            <!-- VIEW 4: NOTIFICATIONS -->
            <section id="view-notifications" class="view-section hidden p-4 space-y-3">
                <h3 class="font-bold text-sm text-darktitle mb-2">小屋即時通知</h3>

            </section>

            <!-- VIEW 5: GUEST PROFILES -->

                                <span id="follow-btn-text">追蹤</span>
                            </button>
                            <button onclick="openAskModalForCurrentGuest()" class="p-2 bg-cream-200 text-dusty-deep rounded-xl text-xs font-semibold hover:bg-dusty-light transition">
                                <i class="fa-solid fa-paper-plane text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center space-x-2">
                            <h2 id="profile-card-name" class="text-lg font-bold text-darktitle">--</h2>
                            <span id="profile-card-handle" class="text-xs text-dusty-dark">@--</span>
                        </div>
                        <p id="profile-card-bio" class="text-xs text-stone-600 mt-2 leading-relaxed">--</p>
                    </div>

                    <div class="flex justify-around py-3 border-y border-dusty-light/60 text-center">
                        <div>
                            <div id="profile-card-posts-count" class="font-bold text-sm text-darktitle">0</div>
                            <div class="text-[10px] text-dusty-dark">動態</div>
                        </div>
                        <div class="border-r border-dusty-light/60"></div>
                        <div>
                            <div id="profile-card-followers-count" class="font-bold text-sm text-darktitle">0</div>
                            <div class="text-[10px] text-dusty-dark">粉絲</div>
                        </div>
                        <div class="border-r border-dusty-light/60"></div>
                        <div>
                            <div id="profile-card-likes-count" class="font-bold text-sm text-darktitle">0</div>
                            <div class="text-[10px] text-dusty-dark">獲讚</div>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-xs font-bold text-dusty-deep mb-3 flex items-center">
                            <i class="fa-solid fa-border-all mr-1.5"></i> 個人發表牆
                        </h4>
                        <div id="profile-posts-grid" class="space-y-3"></div>

                </div>

        </main>

        <nav class="glass-header absolute bottom-0 left-0 right-0 border-t border-dusty-light/80 flex justify-around items-center py-2 px-1 z-30">
            <button onclick="switchTab('feed')" id="tab-feed" class="tab-btn active flex flex-col items-center py-1 px-3 text-accent transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-0.5 font-medium">動態</span>
            </button>
            <button onclick="switchTab('qa')" id="tab-qa" class="tab-btn flex flex-col items-center py-1 px-3 text-dusty-mid hover:text-darktitle transition">
                <i class="fa-solid fa-envelope-open-text text-lg"></i>
                <span class="text-[10px] mt-0.5 font-medium">提問箱</span>
            </button>
            <button onclick="switchTab('heart')" id="tab-heart" class="tab-btn flex flex-col items-center py-1 px-3 text-dusty-mid hover:text-darktitle transition">
                <i class="fa-solid fa-heart text-lg"></i>
                <span class="text-[10px] mt-0.5 font-medium">心動</span>
            </button>
            <button onclick="switchTab('notifications')" id="tab-notifications" class="tab-btn flex flex-col items-center py-1 px-3 text-dusty-mid hover:text-darktitle transition">
                <i class="fa-solid fa-bell text-lg"></i>
                <span class="text-[10px] mt-0.5 font-medium">通知</span>
            </button>
            <button onclick="switchTab('profile')" id="tab-profile" class="tab-btn flex flex-col items-center py-1 px-3 text-dusty-mid hover:text-darktitle transition">
                <i class="fa-solid fa-user-group text-lg"></i>
                <span class="text-[10px] mt-0.5 font-medium">嘉賓</span>
            </button>
        </nav>

        <!-- MODALS -->
        <!-- CREATE POST MODAL -->
        <div id="create-post-modal" class="fixed inset-0 bg-black/60 z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white w-full max-w-[440px] rounded-t-3xl p-5 space-y-4 transform translate-y-full transition-transform duration-300">
                <div class="flex justify-between items-center border-b border-dusty-light pb-2">
                    <h3 class="font-bold text-base text-darktitle">發表心動動態</h3>
                    <button onclick="closeModal('create-post-modal')" class="text-dusty-dark hover:text-darktitle p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div class="flex items-center space-x-3">
                    <div id="post-author-avatar" class="w-9 h-9 rounded-full avatar-box text-lg">👤</div>
                    <div>
                        <span id="post-author-name" class="text-xs font-bold block text-darktitle">--</span>
                        <span class="text-[10px] text-dusty-dark">公開發表至小屋牆</span>
                    </div>
                </div>

                <textarea id="post-text-input" placeholder="分享今天的約會心情、悄悄話或是心動留痕..." class="w-full p-3 border border-dusty-light rounded-xl text-xs bg-cream-50 focus:bg-white focus:outline-none h-28 resize-none"></textarea>

                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-dusty-dark block">附圖網址 (選填)</label>
                    <input id="post-image-input" type="url" placeholder="https://..." class="w-full p-2 border border-dusty-light rounded-xl text-xs bg-cream-50 focus:outline-none">
                </div>

                <button onclick="submitNewPost()" class="w-full py-3 bg-darktitle text-cream-100 font-medium rounded-xl text-xs shadow hover:bg-black transition">
                    發布心動動態
                </button>
            </div>
        </div>

        <!-- COMMENTS MODAL -->
        <div id="comment-modal" class="fixed inset-0 bg-black/60 z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white w-full max-w-[440px] rounded-t-3xl p-5 space-y-4 max-h-[85vh] flex flex-col transform translate-y-full transition-transform duration-300">
                <div class="flex justify-between items-center border-b border-dusty-light pb-2">
                    <h3 class="font-bold text-sm text-darktitle">留言討論</h3>
                    <button onclick="closeModal('comment-modal')" class="text-dusty-dark hover:text-darktitle p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div id="comments-list-container" class="flex-1 overflow-y-auto space-y-3 pr-1 py-1 no-scrollbar min-h-[200px]"></div>

                <div class="flex items-center space-x-2 border-t border-dusty-light pt-3">
                    <input id="comment-input" type="text" placeholder="發表公開留言..." class="flex-1 p-2.5 border border-dusty-light rounded-xl text-xs bg-cream-50 focus:outline-none">
                    <button onclick="submitComment()" class="px-4 py-2.5 bg-dusty-dark text-white rounded-xl text-xs font-semibold hover:bg-dusty-deep transition">
                        傳送
                    </button>
                </div>
            </div>
        </div>

        <!-- ANONYMOUS ASK MODAL -->
        <div id="ask-modal" class="fixed inset-0 bg-black/60 z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white w-full max-w-[440px] rounded-t-3xl p-5 space-y-4 transform translate-y-full transition-transform duration-300">
                <div class="flex justify-between items-center border-b border-dusty-light pb-2">
                    <h3 class="font-bold text-sm text-darktitle">傳送匿名提問</h3>
                    <button onclick="closeModal('ask-modal')" class="text-dusty-dark hover:text-darktitle p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div>
                    <label class="text-xs font-semibold text-dusty-dark block mb-1">指定提問嘉賓</label>
                    <select id="ask-target-select" class="w-full p-2.5 border border-dusty-light rounded-xl text-xs bg-cream-50 font-medium focus:outline-none"></select>
                </div>

                <div>
                    <label class="text-xs font-semibold text-dusty-dark block mb-1">提問內容 (嚴格保護發問者身份)</label>
                    <textarea id="ask-question-text" placeholder="對他/她有什麼好奇或想了解的事？" class="w-full p-3 border border-dusty-light rounded-xl text-xs bg-cream-50 h-28 focus:outline-none resize-none"></textarea>
                </div>

                <button onclick="submitAnonymousQuestion()" class="w-full py-3 bg-accent text-white font-medium rounded-xl text-xs shadow hover:bg-accenthover transition">
                    神秘送出提問
                </button>
            </div>
        </div>

        <!-- TOAST NOTIFICATION -->
        <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-darktitle text-cream-100 text-xs px-4 py-2.5 rounded-full shadow-lg z-50 transition-all duration-300 opacity-0 pointer-events-none flex items-center space-x-2 border border-dusty/30">
            <i id="toast-icon" class="fa-solid fa-circle-check text-accent"></i>
            <span id="toast-message">操作成功</span>
        </div>

    </div>

    <script>
        const EMOJI_AVATARS = ['🦊', '🌸', '👑', '☕', '🍧', '🌙', '🐱', '🌹', '🍓', '🧸', '🍷', '✨'];
        const LOCAL_STORAGE_ROLES = 'ht_rp_roles';
        const LOCAL_STORAGE_ACTIVE = 'ht_active_role_id';

        let appState = {
            currentRole: null,
            deviceRoles: [],
            allGuests: [],
            posts: [],
            questions: [],
            notifications: [],
            votes: {},
            activeViewedProfileId: null,
            currentPostIdForComments: null,
            selectedEmoji: EMOJI_AVATARS[0]
        };

        async function initApp() {
            renderEmojiPicker();

            const savedRoles = localStorage.getItem(LOCAL_STORAGE_ROLES);
            appState.deviceRoles = savedRoles ? JSON.parse(savedRoles) : [];

            const activeId = localStorage.getItem(LOCAL_STORAGE_ACTIVE);
            if (activeId && appState.deviceRoles.length > 0) {
                appState.currentRole = appState.deviceRoles.find(r => r.id === activeId) || appState.deviceRoles[0];
            }

            if (window.HT_FIREBASE) {
                await window.HT_FIREBASE.initAuth();
            }

            if (appState.currentRole) {
                document.getElementById('role-setup-overlay').classList.add('hidden');
                updateCurrentRoleHeader();
                renderAllViews();
            } else {
                showRoleSetupOverlay();
            }
        }

        function renderEmojiPicker() {
            const container = document.getElementById('emoji-avatar-grid');
            container.innerHTML = EMOJI_AVATARS.map((emoji, i) => `
                <div onclick="selectEmojiAvatar('${emoji}', this)" 
                     class="w-9 h-9 rounded-full flex items-center justify-center text-lg cursor-pointer bg-cream-200 border-2 ${i===0 ? 'border-accent' : 'border-transparent'} hover:scale-110 transition">
                     ${emoji}
                </div>
            `).join('');
        }

        function selectEmojiAvatar(emoji, el) {
            appState.selectedEmoji = emoji;
            document.querySelectorAll('#emoji-avatar-grid div').forEach(div => div.classList.replace('border-accent', 'border-transparent'));
            el.classList.replace('border-transparent', 'border-accent');
            document.getElementById('role-avatar-custom').value = '';
        }

        function renderAvatarHtml(avatarData, cssClass = "w-10 h-10 text-base") {
            if (!avatarData) return `<div class="avatar-box ${cssClass}">👤</div>`;
            if (avatarData.startsWith('http://') || avatarData.startsWith('https://')) {
                return `<img src="${avatarData}" class="${cssClass} rounded-full object-cover border border-dusty-light">`;
            }
            return `<div class="avatar-box ${cssClass}">${avatarData}</div>`;
        }

        function showRoleSetupOverlay() {
            const overlay = document.getElementById('role-setup-overlay');
            overlay.classList.remove('hidden');

            const section = document.getElementById('device-roles-section');
            const list = document.getElementById('device-roles-list');

            if (appState.deviceRoles.length > 0) {
                section.classList.remove('hidden');
                list.innerHTML = appState.deviceRoles.map(r => `
                    <div onclick="switchActiveRole('${r.id}')" class="p-2.5 bg-white rounded-2xl border border-dusty-light flex items-center justify-between cursor-pointer hover:bg-cream-100 transition">
                        <div class="flex items-center space-x-2.5">
                            ${renderAvatarHtml(r.avatar, "w-8 h-8 text-sm")}
                            <div>
                                <h5 class="text-xs font-bold text-darktitle">${r.name}</h5>
                                <span class="text-[10px] text-dusty-dark">@${r.handle}</span>
                            </div>
                        </div>
                        <span class="text-[10px] font-semibold text-accent">登入切換 →</span>
                    </div>
                `).join('');
            } else {
                section.classList.add('hidden');
            }
        }

        window.submitRoleCreation = function() {
            const name = document.getElementById('role-name').value.trim();
            let handle = document.getElementById('role-handle').value.trim().replace('@', '');
            let customAvatar = document.getElementById('role-avatar-custom').value.trim();
            const bio = document.getElementById('role-bio').value.trim();

            if (!name) {
                showToast("請輸入嘉賓暱稱", true);
                return;
            }

            if (!handle) handle = 'guest_' + Math.floor(Math.random() * 899 + 100);
            const avatar = customAvatar || appState.selectedEmoji;

            const newRole = {
                id: 'role_' + Date.now(),
                name,
                handle,
                avatar,
                bio: bio || "這個嘉賓很神秘，尚未留下宣言。"
            };

            appState.deviceRoles.push(newRole);
            localStorage.setItem(LOCAL_STORAGE_ROLES, JSON.stringify(appState.deviceRoles));

            appState.currentRole = newRole;
            localStorage.setItem(LOCAL_STORAGE_ACTIVE, newRole.id);

            if (!appState.allGuests.some(g => g.id === newRole.id)) {
                appState.allGuests.push(newRole);
            }

            document.getElementById('role-setup-overlay').classList.add('hidden');
            updateCurrentRoleHeader();
            renderAllViews();
            showToast(`已建立並登場嘉賓：${newRole.name}`);
        };

        window.switchActiveRole = function(roleId) {
            const target = appState.deviceRoles.find(r => r.id === roleId);
            if (target) {
                appState.currentRole = target;
                localStorage.setItem(LOCAL_STORAGE_ACTIVE, target.id);
                document.getElementById('role-setup-overlay').classList.add('hidden');
                updateCurrentRoleHeader();
                renderAllViews();
                showToast(`已切換身份為：${target.name}`);
            }
        };

        window.openRoleSwitchModal = function() {
            showRoleSetupOverlay();
        };

        function updateCurrentRoleHeader() {
            if (!appState.currentRole) return;
            document.getElementById('header-user-avatar').innerHTML = renderAvatarHtml(appState.currentRole.avatar, "w-5 h-5 text-xs");
            document.getElementById('header-user-name').innerText = appState.currentRole.name;
        }

        function renderAllViews() {
            renderFeedView();
            renderQAView();
            renderHeartVoteGrid();
            renderNotificationsView();
            renderProfileList();
            renderProfileDetail(appState.activeViewedProfileId || appState.currentRole.id);
        }

        function renderFeedView() {
            // Render Stories (All joined guests)
            const storyContainer = document.getElementById('story-guests-container');
            if (appState.allGuests.length === 0) {
                storyContainer.innerHTML = `<span class="text-[10px] text-dusty-dark py-2">目前沒有其他嘉賓加入</span>`;
            } else {
                storyContainer.innerHTML = appState.allGuests.map(g => `
                    <div onclick="viewProfile('${g.id}')" class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                        <div class="w-13 h-13 w-[52px] h-[52px] rounded-full p-0.5 border-2 border-accent/80 bg-white shadow-sm hover:scale-105 transition flex items-center justify-center">
                            ${renderAvatarHtml(g.avatar, "w-full h-full text-xl")}
                        </div>
                        <span class="text-[10px] mt-1 font-medium text-darktitle max-w-[56px] truncate">${g.name}</span>
                    </div>
                `).join('');
            }

            // Render Posts
            const postsContainer = document.getElementById('posts-container');
            if (appState.posts.length === 0) {
                postsContainer.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-3xl border border-dusty-light/60 p-6 space-y-2">
                        <p class="text-xs font-bold text-darktitle">尚無嘉賓發布動態</p>
                        <p class="text-[11px] text-dusty-dark">點擊左上方「發動態」分享你的小屋心情吧！</p>
                    </div>
                `;
                return;
            }

            postsContainer.innerHTML = appState.posts.map(post => {
                const isLiked = (post.likes || []).includes(appState.currentRole.id);
                const likeCount = (post.likes || []).length;
                const commentCount = (post.comments || []).length;

                return `
                <article class="bg-white rounded-3xl p-4 shadow-sm border border-dusty-light/60 space-y-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2.5 cursor-pointer" onclick="viewProfile('${post.authorId}')">
                            ${renderAvatarHtml(post.authorAvatar, "w-10 h-10 text-base")}
                            <div>
                                <h4 class="text-xs font-bold text-darktitle leading-snug">${post.authorName}</h4>
                                <span class="text-[10px] text-dusty-dark">${post.timestamp || '剛剛'}</span>
                            </div>
                        </div>
                    </div>

                    <p class="text-xs text-stone-800 leading-relaxed">${escapeHtml(post.text)}</p>

                    ${post.image ? `
                        <div class="rounded-2xl overflow-hidden max-h-72 border border-cream-200">
                            <img src="${post.image}" class="w-full h-full object-cover" loading="lazy">
                        </div>
                    ` : ''}

                    <div class="flex items-center justify-between pt-2 border-t border-dusty-light/40 text-xs">
                        <div class="flex items-center space-x-4">
                            <button onclick="toggleLikePost('${post.id}')" class="flex items-center space-x-1.5 ${isLiked ? 'text-accent font-bold' : 'text-dusty-dark hover:text-darktitle'} transition">
                                <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart text-base ${isLiked ? 'animate-heart' : ''}"></i>
                                <span>${likeCount}</span>
                            </button>
                            <button onclick="openCommentModal('${post.id}')" class="flex items-center space-x-1.5 text-dusty-dark hover:text-darktitle transition">
                                <i class="fa-regular fa-comment text-base"></i>
                                <span>${commentCount}</span>
                            </button>
                        </div>
                        <span class="text-[10px] text-dusty-mid italic">HEARTTRACE ‧ 戀綜動態</span>
                    </div>
                </article>
                `;
            }).join('');
        }

        function renderQAView() {
            const container = document.getElementById('questions-list');
            if (appState.questions.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-dusty-dark text-xs">目前沒有匿名提問。點擊上方按鈕發送吧！</div>`;
                return;
            }

            container.innerHTML = appState.questions.map(q => `
                <div class="bg-white rounded-2xl p-4 border border-dusty-light shadow-sm space-y-3">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-accent bg-accent/10 px-2.5 py-0.5 rounded-full text-[10px]">對 ${q.targetName} 的匿名提問</span>
                        <span class="text-dusty-dark text-[10px]">${q.timestamp || '最近'}</span>
                    </div>
                    <p class="text-xs font-semibold text-darktitle bg-cream-100 p-3 rounded-xl border border-dusty-light/40">
                        💬 "${escapeHtml(q.question)}"
                    </p>

                    ${q.answer ? `
                        <div class="pl-3 border-l-2 border-accent/60 space-y-1">
                            <span class="text-[10px] font-bold text-dusty-deep">${q.answeredBy || q.targetName} 公開回答：</span>
                            <p class="text-xs text-stone-700">${escapeHtml(q.answer)}</p>
                        </div>
                    ` : (appState.currentRole.id === q.targetId ? `
                        <div class="pt-1 flex space-x-2">
                            <input id="ans-input-${q.id}" type="text" placeholder="以 ${q.targetName} 身份公開回答..." class="flex-1 p-2 border border-dusty-light rounded-xl text-xs bg-cream-50 focus:bg-white">
                            <button onclick="answerQuestion('${q.id}')" class="px-3 py-1.5 bg-darktitle text-white rounded-xl text-xs font-semibold">回答</button>
                        </div>
                    ` : `<p class="text-[10px] text-dusty-dark italic">等待 ${q.targetName} 回答中...</p>`)}
                </div>
            `).join('');
        }

        function renderHeartVoteGrid() {
            const grid = document.getElementById('vote-targets-grid');
            const eligible = appState.allGuests.filter(g => g.id !== appState.currentRole.id);

            if (eligible.length === 0) {
                grid.innerHTML = `<p class="col-span-3 text-xs text-dusty-dark text-center py-4">需要有其他嘉賓登場才能投票喔</p>`;
                return;
            }

            grid.innerHTML = eligible.map(g => {
                const isSelected = appState.votes[appState.currentRole.id] === g.id;
                return `
                <div onclick="selectVoteTarget('${g.id}')" class="border-2 ${isSelected ? 'border-accent bg-accent/5' : 'border-dusty-light bg-cream-50'} rounded-2xl p-3 flex flex-col items-center cursor-pointer transition hover:scale-102">
                    ${renderAvatarHtml(g.avatar, "w-12 h-12 text-xl mb-1")}
                    <span class="text-xs font-bold text-darktitle truncate w-full text-center">${g.name}</span>
                    <span class="text-[9px] text-dusty-dark mt-0.5">${isSelected ? '❤️ 已選擇' : '點擊選擇'}</span>
                </div>
                `;
            }).join('');
        }

        function renderNotificationsView() {
            const container = document.getElementById('notifications-list');
            if (appState.notifications.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-dusty-dark text-xs">暫無任何新通知</div>`;
                return;
            }

            container.innerHTML = appState.notifications.map(n => `
                <div class="bg-white p-3 rounded-2xl border border-dusty-light/60 flex items-center space-x-3 shadow-sm">
                    <div class="w-8 h-8 rounded-full bg-accent/10 flex items-center justify-center text-accent text-xs">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-xs text-darktitle font-medium">${escapeHtml(n.text)}</p>
                        <span class="text-[9px] text-dusty-dark">${n.timestamp || '剛剛'}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderProfileList() {
            const list = document.getElementById('profile-selector-list');
            if (appState.allGuests.length === 0) {
                list.innerHTML = `<span class="text-xs text-dusty-dark">尚無成員</span>`;
                return;
            }

            list.innerHTML = appState.allGuests.map(g => `
                <button onclick="viewProfile('${g.id}')" class="flex-shrink-0 px-3 py-1.5 rounded-xl border ${appState.activeViewedProfileId === g.id ? 'bg-darktitle text-cream-100 border-darktitle' : 'bg-white text-dusty-deep border-dusty-light'} text-xs font-medium transition flex items-center space-x-1.5">
                    ${renderAvatarHtml(g.avatar, "w-4 h-4 text-[10px]")}
                    <span>${g.name}</span>
                </button>
            `).join('');
        }

        function renderProfileDetail(guestId) {
            appState.activeViewedProfileId = guestId;
            renderProfileList();

            const guest = appState.allGuests.find(g => g.id === guestId) || appState.currentRole;
            document.getElementById('profile-card-avatar').innerHTML = renderAvatarHtml(guest.avatar, "w-20 h-20 text-4xl");
            document.getElementById('profile-card-name').innerText = guest.name;
            document.getElementById('profile-card-handle').innerText = `@${guest.handle}`;
            document.getElementById('profile-card-bio').innerText = guest.bio;

            const guestPosts = appState.posts.filter(p => p.authorId === guestId);
            document.getElementById('profile-card-posts-count').innerText = guestPosts.length;

            const totalLikes = guestPosts.reduce((acc, p) => acc + ((p.likes || []).length), 0);
            document.getElementById('profile-card-likes-count').innerText = totalLikes;

            const grid = document.getElementById('profile-posts-grid');
            if (guestPosts.length === 0) {
                grid.innerHTML = `<p class="text-xs text-dusty-dark text-center py-6">該嘉賓尚未發布動態</p>`;
            } else {
                grid.innerHTML = guestPosts.map(p => `
                    <div class="bg-cream-50 p-3 rounded-2xl border border-dusty-light/60 space-y-2">
                        <p class="text-xs text-darktitle font-normal">${escapeHtml(p.text)}</p>
                        ${p.image ? `<img src="${p.image}" class="w-full h-32 object-cover rounded-xl">` : ''}
                        <div class="text-[10px] text-dusty-dark flex justify-between pt-1">
                            <span>${p.timestamp || '發表'}</span>
                            <span>❤️ ${(p.likes || []).length}</span>
                        </div>
                    </div>
                `).join('');
            }
        }

        // FULLSCREEN TOGGLE CONTROLLER
        window.toggleFullScreen = function() {
            const doc = window.document;
            const docEl = doc.documentElement;

            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestAnimationFrame || docEl.msRequestFullscreen;
            const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                if (requestFullScreen) {
                    requestFullScreen.call(docEl);
                } else {
                    document.body.classList.add('is-fullscreen');
                }
                document.getElementById('fullscreen-icon').className = 'fa-solid fa-compress';
                showToast("已進入全螢幕體驗");
            } else {
                if (cancelFullScreen) {
                    cancelFullScreen.call(doc);
                }
                document.body.classList.remove('is-fullscreen');
                document.getElementById('fullscreen-icon').className = 'fa-solid fa-expand';
            }
        };

        // USER ACTIONS & CONTROLLERS
        window.switchTab = function(tabName) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('text-accent');
                b.classList.add('text-dusty-mid');
            });

            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.add('text-accent');
            activeBtn.classList.remove('text-dusty-mid');
        };

        window.viewProfile = function(guestId) {
            switchTab('profile');
            renderProfileDetail(guestId);
        };

        window.openCreatePostModal = function() {
            document.getElementById('post-author-avatar').innerHTML = renderAvatarHtml(appState.currentRole.avatar, "w-9 h-9 text-lg");
            document.getElementById('post-author-name').innerText = appState.currentRole.name;
            openModal('create-post-modal');
        };

        window.submitNewPost = function() {
            const text = document.getElementById('post-text-input').value.trim();
            const image = document.getElementById('post-image-input').value.trim();

            if (!text && !image) {
                showToast("請輸入內容或附圖", true);
                return;
            }

            const newPost = {
                id: 'p_' + Date.now(),
                authorId: appState.currentRole.id,
                authorName: appState.currentRole.name,
                authorAvatar: appState.currentRole.avatar,
                text,
                image,
                timestamp: "剛剛",
                likes: [],
                comments: []
            };

            appState.posts.unshift(newPost);

            document.getElementById('post-text-input').value = '';
            document.getElementById('post-image-input').value = '';
            closeModal('create-post-modal');
            renderFeedView();
            showToast("動態已公開發布！");
        };

        window.toggleLikePost = function(postId) {
            const post = appState.posts.find(p => p.id === postId);
            if (!post) return;

            post.likes = post.likes || [];
            const index = post.likes.indexOf(appState.currentRole.id);
            if (index > -1) {
                post.likes.splice(index, 1);
            } else {
                post.likes.push(appState.currentRole.id);
                addNotification(`${appState.currentRole.name} 讚了 ${post.authorName} 的貼文`);
            }

            renderFeedView();
        };

        window.openCommentModal = function(postId) {
            appState.currentPostIdForComments = postId;
            renderCommentsModalList();
            openModal('comment-modal');
        };

        function renderCommentsModalList() {
            const post = appState.posts.find(p => p.id === appState.currentPostIdForComments);
            const container = document.getElementById('comments-list-container');

            if (!post || !post.comments || post.comments.length === 0) {
                container.innerHTML = `<p class="text-xs text-dusty-dark text-center py-8">尚無留言，第一個發表心得吧！</p>`;
                return;
            }

            container.innerHTML = post.comments.map(c => `
                <div class="bg-cream-50 p-2.5 rounded-xl border border-dusty-light/50 space-y-1">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-darktitle">${escapeHtml(c.authorName)}</span>
                        <span class="text-[9px] text-dusty-dark">${c.timestamp || '剛剛'}</span>
                    </div>
                    <p class="text-xs text-stone-700">${escapeHtml(c.text)}</p>
                </div>
            `).join('');
        }

        window.submitComment = function() {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text) return;

            const post = appState.posts.find(p => p.id === appState.currentPostIdForComments);
            if (!post) return;

            post.comments = post.comments || [];
            post.comments.push({
                id: 'c_' + Date.now(),
                authorName: appState.currentRole.name,
                text,
                timestamp: "剛剛"
            });

            input.value = '';
            renderCommentsModalList();
            renderFeedView();
            addNotification(`${appState.currentRole.name} 留言了 ${post.authorName} 的貼文`);
        };

        window.openAskModal = function() {
            const select = document.getElementById('ask-target-select');
            if (appState.allGuests.length === 0) {
                select.innerHTML = `<option value="">尚未有嘉賓可提問</option>`;
            } else {
                select.innerHTML = appState.allGuests.map(g => `<option value="${g.id}">${g.name} (@${g.handle})</option>`).join('');
            }

            openModal('ask-modal');
        };

        window.openAskModalForCurrentGuest = function() {
            openAskModal();
            document.getElementById('ask-target-select').value = appState.activeViewedProfileId;
        };

        window.submitAnonymousQuestion = function() {
            const targetId = document.getElementById('ask-target-select').value;
            const targetGuest = appState.allGuests.find(g => g.id === targetId);
            const questionText = document.getElementById('ask-question-text').value.trim();

            if (!questionText || !targetId) {
                showToast("請選擇嘉賓並輸入提問", true);
                return;
            }

            appState.questions.unshift({
                id: 'q_' + Date.now(),
                targetId,
                targetName: targetGuest ? targetGuest.name : "嘉賓",
                question: questionText,
                answer: "",
                answeredBy: "",
                timestamp: "剛剛"
            });

            document.getElementById('ask-question-text').value = '';
            closeModal('ask-modal');
            renderQAView();
            showToast("匿名提問已成功寄出！");
            addNotification(`有人向 ${targetGuest ? targetGuest.name : '嘉賓'} 送出了匿名提問`);
        };

        window.answerQuestion = function(qId) {
            const input = document.getElementById(`ans-input-${qId}`);
            const answerText = input.value.trim();
            if (!answerText) return;

            const q = appState.questions.find(item => item.id === qId);
            if (!q) return;

            q.answer = answerText;
            q.answeredBy = appState.currentRole.name;

            renderQAView();
            showToast("已公開回答提問");
        };

        window.selectVoteTarget = function(guestId) {
            appState.votes[appState.currentRole.id] = guestId;
            renderHeartVoteGrid();
        };

        window.submitHeartVote = function() {
            const votedId = appState.votes[appState.currentRole.id];
            if (!votedId) {
                showToast("請點擊選擇一位心動嘉賓", true);
                return;
            }

            document.getElementById('vote-status-msg').classList.remove('hidden');
            showToast(`秘密心動投票成功！結果嚴密保護不公開。`);
        };

        function addNotification(text) {
            appState.notifications.unshift({
                id: 'n_' + Date.now(),
                text,
                timestamp: "剛剛"
            });
            renderNotificationsView();
        }

        // UTILS
        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.firstElementChild.classList.remove('translate-y-full');
            }, 10);
        }

        window.closeModal = function(id) {
            const modal = document.getElementById(id);
            modal.firstElementChild.classList.add('translate-y-full');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-message').innerText = msg;

            icon.className = isError 
                ? "fa-solid fa-triangle-exclamation text-red-400" 
                : "fa-solid fa-circle-check text-accent";

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
